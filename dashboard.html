<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت نهان - Nahan Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased">
    <div class="min-h-screen flex flex-col">
        <!-- هدر پنل -->
        <header class="bg-slate-800 border-b border-slate-700 p-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-emerald-400">پنل مدیریت نهان (نسخه <span id="version-text">3.1.0</span>)</h1>
            <div class="flex items-center gap-4">
                <span class="bg-emerald-500/10 text-emerald-400 text-sm px-3 py-1 rounded-full border border-emerald-500/20">
                    اتصالات فعال: <strong id="active-conns">0</strong>
                </span>
            </div>
        </header>

        <!-- محتوای اصلی -->
        <main class="flex-1 p-6 max-w-7xl mx-auto w-full grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- بخش وضعیت کلی -->
            <div class="bg-slate-800/50 border border-slate-700 rounded-xl p-5 shadow-lg">
                <h2 class="text-lg font-semibold mb-4 text-slate-200">وضعیت سیستم و ارتباطات</h2>
                <div id="status-box" class="space-y-3 text-sm text-slate-300">
                    <p>وضعیت سرور: <span class="text-emerald-400 font-bold">پایدار و آنلاین</span></p>
                    <p>شروع محاسبه انقضا: <span class="text-sky-400">از اولین اتصال کاربر</span></p>
                </div>
            </div>

            <!-- بخش لاگ‌های اتصال -->
            <div class="bg-slate-800/50 border border-slate-700 rounded-xl p-5 shadow-lg">
                <h2 class="text-lg font-semibold mb-4 text-slate-200">گزارشات اتصال اخیر (Connection Logs)</h2>
                <div id="logs-container" class="space-y-2 text-xs font-mono bg-slate-950 p-3 rounded-lg h-48 overflow-y-auto border border-slate-800">
                    <p class="text-slate-500">در حال دریافت گزارشات...</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        async function fetchStats() {
            try {
                const res = await fetch('./api/stats');
                const data = await res.json();
                if(data.success) {
                    document.getElementById('active-conns').innerText = data.stats.activeConnections;
                }
            } catch (e) {
                console.error('خطا در دریافت آمار');
            }
        }

        async function fetchConnLogs() {
            try {
                const res = await fetch('./api/conn_logs');
                const data = await res.json();
                if(data.success && data.connectionHistory) {
                    const container = document.getElementById('logs-container');
                    if(data.connectionHistory.length === 0) {
                        container.innerHTML = '<p class="text-slate-500">هیچ رویدادی ثبت نشده است.</p>';
                        return;
                    }
                    container.innerHTML = data.connectionHistory.map(log => `
                        <div class="flex justify-between border-b border-slate-900 pb-1">
                            <span class="${log.status === 'connected' ? 'text-emerald-400' : 'text-rose-400'}">[${log.status.toUpperCase()}] ID: ${log.connId}</span>
                            <span class="text-slate-400">${new Date(log.time).toLocaleTimeString('fa-IR')}</span>
                        </div>
                    `).join('');
                }
            } catch (e) {
                console.error('خطا در دریافت لاگ‌ها');
            }
        }

        setInterval(() => {
            fetchStats();
            fetchConnLogs();
        }, 5000);

        fetchStats();
        fetchConnLogs();
    </script>
</body>
</html>
